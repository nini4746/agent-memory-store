plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'dev.nini'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    testcontainersVersion = '1.21.3'
    jqwikVersion = '1.9.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // MCP server (JSON-RPC over stdio) is implemented directly; see Plan 09 notes.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // Benchmark scenarios are YAML data files (Plan 10).
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // jqwik registers its own engine alongside JUnit Jupiter.
    // Pin the Docker Engine API version so Testcontainers' docker-java client
    // negotiates successfully with newer Docker Desktop daemons. Harmless when
    // Docker is absent (container tests are skipped via disabledWithoutDocker).
    if (System.getenv('DOCKER_API_VERSION') != null) {
        environment 'DOCKER_API_VERSION', System.getenv('DOCKER_API_VERSION')
    }
    // Forward the optional external-database override to the test JVM.
    ['memstore.test.jdbcUrl', 'memstore.test.dbUser', 'memstore.test.dbPassword']
            .each { key ->
                if (System.getProperty(key) != null) {
                    systemProperty key, System.getProperty(key)
                }
            }
}

// Benchmark harness (Plan 10) and demo runner (Plan 11) are wired as separate
// entry points that require live LLM/embedding keys; see those plans.
// Forwards -D properties for spring/memstore/bench/demo config to a JavaExec JVM.
def forwardProps = { JavaExec task ->
    System.properties.each { key, value ->
        String k = key.toString()
        if (k.startsWith('spring.') || k.startsWith('memstore.')
                || k.startsWith('bench.') || k.startsWith('demo.')) {
            task.systemProperty(k, value.toString())
        }
    }
}

tasks.register('benchRun', JavaExec) {
    group = 'application'
    description = 'Runs the MemFail-style benchmark harness. Uses fake providers by default; real run needs ANTHROPIC_API_KEY, EMBEDDING_API_KEY.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.nini.memstore.bench.BenchRunner'
    doFirst { forwardProps(it) }
}

tasks.register('demoRun', JavaExec) {
    group = 'application'
    description = 'Runs the 3-session demo scenario. Uses fake providers by default; real run needs ANTHROPIC_API_KEY, EMBEDDING_API_KEY.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.nini.memstore.demo.DemoRunner'
    doFirst { forwardProps(it) }
}
