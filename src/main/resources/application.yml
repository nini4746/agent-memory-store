spring:
  application:
    name: agent-memory-store
  datasource:
    url: ${MEMSTORE_DB_URL:jdbc:postgresql://localhost:5432/memstore}
    username: ${MEMSTORE_DB_USER:memstore}
    password: ${MEMSTORE_DB_PASSWORD:memstore}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must not touch it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

memstore:
  # Embedding provider configuration. Values are intentionally blank so the
  # server fails loud if a real provider is expected without configuration.
  # Tests inject a deterministic fake provider instead.
  embedding:
    provider: ${EMBEDDING_PROVIDER:fake}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:fake-embed-1536}
    dimension: ${EMBEDDING_DIM:1536}
    base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
  llm:
    provider: ${MEMSTORE_LLM_PROVIDER:fake}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${MEMSTORE_LLM_MODEL:claude-opus-4-8}
    base-url: ${MEMSTORE_LLM_BASE_URL:https://api.anthropic.com}
  # Retrieval scoring weights (Plan 05). Defaults match SPEC R3.
  scoring:
    weight-similarity: 0.55
    weight-recency: 0.25
    weight-confidence: 0.20
    needs-review-penalty: 0.5
  # Conflict-detection candidate window (SPEC R4). Only the nearest
  # candidate-limit active facts with similarity >= candidate-threshold are
  # inspected for contradictions; a contradiction outside this window is missed.
  # Defaults preserve historical behaviour (top-5, 0.80).
  conflict:
    candidate-limit: 5
    candidate-threshold: 0.80
  budget:
    default-tokens: 2000
    max-tokens: 8000
  # Type-specific half-lives in days, shared by retrieval recency (Plan 05)
  # and decay (Plan 07). SPEC R5 defaults.
  half-life-days:
    preference: 180
    constraint: 180
    decision: 90
    event: 30
    entity: 365
  decay:
    expire-threshold: 0.15
  maintenance:
    review-batch-size: 20
    llm-call-budget: 50

logging:
  level:
    dev.nini.memstore: INFO
