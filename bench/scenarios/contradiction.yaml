# Contradiction updates: the newer session's fact must supersede the older one.
- id: contradiction-01
  category: contradiction
  description: PostgreSQL version updated across sessions
  sessions:
    - source: q1
      offset_days: -120
      utterances:
        - content: "We decided to use PostgreSQL version 15"
    - source: q2
      offset_days: -10
      utterances:
        - content: "We decided to use PostgreSQL version 17"
  extract: true
  query:
    text: "PostgreSQL version"
  expect:
    contains_all: ["17"]
    excludes: ["15"]

