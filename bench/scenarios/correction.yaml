# Explicit corrections: memory_correct must retract the target and let the
# correction win.
- id: correction-01
  category: correction
  description: Deploy target corrected
  sessions:
    - source: s
      offset_days: -20
      utterances:
        - content: "We decided to deploy on AWS"
  extract: true
  correct:
    - target_contains: "AWS"
      statement: "We decided to deploy on GCP"
  query:
    text: "deploy"
  expect:
    contains_all: ["GCP"]
    excludes: ["AWS"]

