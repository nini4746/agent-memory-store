# Budget / routing: retrieval must never exceed the token budget, so a small
# budget returns only a subset of the matching facts.
- id: budget-01
  category: budget
  description: Eight guidelines, tight budget returns a subset
  sessions:
    - source: s
      offset_days: -5
      utterances:
        - content: "We decided that guideline alpha applies to services"
        - content: "We decided that guideline bravo applies to services"
        - content: "We decided that guideline charlie applies to services"
        - content: "We decided that guideline delta applies to services"
        - content: "We decided that guideline echo applies to services"
        - content: "We decided that guideline foxtrot applies to services"
        - content: "We decided that guideline golf applies to services"
        - content: "We decided that guideline hotel applies to services"
  extract: true
  query:
    text: "guideline services"
    budget_tokens: 40
  expect:
    tokens_within_budget: true
    active_hit_count_lt: 8

