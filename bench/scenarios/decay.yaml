# Decay / staleness: aged event facts must expire out of active recall but
# remain retrievable with include_inactive.
- id: decay-01
  category: decay
  description: Old mobile app release expires
  sessions:
    - source: s
      offset_days: -1
      utterances:
        - content: "The mobile app was released last spring"
  extract: true
  age:
    - contains: "mobile"
      days: 400
  maintenance: true
  query:
    text: "mobile app release"
  expect:
    active_hit_count: 0
    inactive_contains: "released"

