name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # AbstractPostgresIntegrationTest starts a pgvector/pgvector:pg16
      # Testcontainer; it skips when Docker is absent, but Docker is present here.
      - run: ./gradlew test
