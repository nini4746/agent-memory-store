services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memstore-postgres
    environment:
      POSTGRES_DB: memstore
      POSTGRES_USER: memstore
      POSTGRES_PASSWORD: memstore
    ports:
      - "5432:5432"
    volumes:
      - memstore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memstore -d memstore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memstore-pgdata:
